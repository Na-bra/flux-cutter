<title>FluxCutter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground:  #E7EBEA;
    --chrome:  #F4F6F5;
    --surface: #FFFFFF;
    --sunk:    #EAEEED;
    --ink:     #12171A;
    --muted:   #5A676C;
    --faint:   #8A9599;
    --rule:    #D3DAD9;
    --accent:  #0E6E6B;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEBEA;
    --signal:  #9A5610;
    --shadow:  0 1px 2px rgba(18,23,26,.06), 0 8px 24px rgba(18,23,26,.07);
    --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:  #0B0F11;
      --chrome:  #171F22;
      --surface: #1B2427;
      --sunk:    #141B1E;
      --ink:     #E6ECEA;
      --muted:   #9AA8AB;
      --faint:   #6E7C80;
      --rule:    #2A3538;
      --accent:  #46BDB4;
      --accent-ink: #06211F;
      --accent-soft: #123230;
      --signal:  #E0A44B;
      --shadow:  0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"] {
    --ground:  #0B0F11;
    --chrome:  #171F22;
    --surface: #1B2427;
    --sunk:    #141B1E;
    --ink:     #E6ECEA;
    --muted:   #9AA8AB;
    --faint:   #6E7C80;
    --rule:    #2A3538;
    --accent:  #46BDB4;
    --accent-ink: #06211F;
    --accent-soft: #123230;
    --signal:  #E0A44B;
    --shadow:  0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.34);
  }

  body { background: var(--chrome); color: var(--ink); font-family: var(--ui); font-size: 14px; -webkit-font-smoothing: antialiased; }

  html, body { height: 100%; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; background: var(--chrome); }

  .caption {
    font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline;
  }

  /* --------------------------------------------------------- app window */

  .window {
    background: var(--chrome);
    border: 1px solid var(--rule);
    border-radius: 9px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--chrome);
    border-bottom: 1px solid var(--rule);
  }
  .lights { display: flex; gap: 7px; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; display: block; background: var(--rule); }
  .titlebar .name { font-size: .8rem; font-weight: 600; color: var(--muted); margin: 0 auto; letter-spacing: .01em; }

  /* ------------------------------------------------------------ toolbar */

  .toolbar {
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 12px;
    padding: 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    align-items: end;
  }
  @media (max-width: 860px) { .toolbar { grid-template-columns: 1fr 1fr; } }

  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field > label {
    font-family: var(--mono); font-size: .64rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint);
  }

  .control {
    display: flex; align-items: center; gap: 8px;
    background: var(--sunk);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 0 10px;
    height: 34px;
    min-width: 0;
  }
  .control .path {
    font-family: var(--mono); font-size: .78rem; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .control .dim { color: var(--faint); }

  select, input[type="text"] {
    font-family: var(--ui); font-size: .82rem; color: var(--ink);
    background: var(--sunk); border: 1px solid var(--rule); border-radius: 5px;
    height: 34px; padding: 0 9px; width: 100%; min-width: 0;
  }

  button {
    font-family: var(--ui); font-size: .82rem; font-weight: 600;
    border-radius: 5px; height: 34px; padding: 0 15px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--sunk); color: var(--ink);
    white-space: nowrap;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.ghost { background: transparent; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* ------------------------------------------------------------ status */

  .status {
    display: flex; align-items: center; gap: 14px;
    padding: 9px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    font-size: .8rem;
  }
  .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; min-width: 60px; }
  .bar span { display: block; height: 100%; background: var(--accent); width: 100%; }
  .status .msg { color: var(--muted); }
  .status .msg b { color: var(--ink); font-weight: 600; }
  .status .time { font-family: var(--mono); font-size: .74rem; color: var(--faint); }

  /* ----------------------------------------------------------- gallery */

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 268px; flex: 1; min-height: 0; }
  @media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }

  .gallery { padding: 16px 14px; background: var(--ground); overflow-y: auto; min-height: 0; }

  .gallery-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .gallery-head h2 { font-size: .95rem; font-weight: 600; margin: 0; }
  .gallery-head .meta { font-family: var(--mono); font-size: .72rem; color: var(--faint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 12px; }
  .grid > p { grid-column: 1 / -1; color: var(--faint); font-size: .8rem; margin: 0; }

  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; overflow: hidden; cursor: pointer;
    text-align: left; padding: 0; height: auto; display: block; width: 100%;
    font-family: var(--ui);
  }
  .card:hover { border-color: var(--accent); }
  .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  .thumb { aspect-ratio: 1; display: block; width: 100%; background: var(--sunk); }

  .card .info { display: block; padding: 8px 9px 9px; border-top: 1px solid var(--rule); }
  .card .who { font-size: .8rem; font-weight: 600; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .card .who .rank { font-family: var(--mono); font-size: .66rem; color: var(--faint); font-weight: 400; }
  .card .stat { display: block; font-family: var(--mono); font-size: .68rem; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

  .unassigned {
    margin-top: 14px; padding: 9px 11px; border: 1px dashed var(--rule);
    border-radius: 5px; color: var(--muted); font-size: .76rem; background: var(--surface);
  }

  .fixups { margin-left: auto; display: flex; gap: 5px; }
  .fixups button { height: 24px; padding: 0 9px; font-size: .74rem; }

  /* The split picker: one shot per track, because a track is the only
     unit a person's card can honestly be divided along. */
  .split { margin-bottom: 14px; border-bottom: 1px solid var(--rule); padding-bottom: 11px; }
  .split-head { margin: 0 0 9px; font-size: .78rem; color: var(--faint); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .split-head b { color: var(--ink); }
  .split-head button { height: 24px; padding: 0 9px; font-size: .74rem; margin-left: auto; }
  .split-head button + button { margin-left: 0; }
  .tracks .card { aspect-ratio: auto; }
  .tracks img { width: 100%; display: block; border-radius: 3px; }
  .tracks .at { font-family: var(--mono); font-size: .66rem; color: var(--faint); padding: 3px 4px; display: block; }

  /* -------------------------------------------------------- export rail */

  .rail { background: var(--surface); border-left: 1px solid var(--rule); padding: 16px 14px; display: flex; flex-direction: column; gap: 13px; overflow-y: auto; min-height: 0; }
  @media (max-width: 860px) { .rail { border-left: none; border-top: 1px solid var(--rule); } }

  .rail h3 {
    font-family: var(--mono); font-size: .64rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); margin: 0;
  }

  .picked { border: 1px solid var(--rule); border-radius: 6px; padding: 11px; background: var(--sunk); }
  .picked .name { font-weight: 600; font-size: .9rem; }
  .picked dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: .76rem; }
  .picked dt { font-family: var(--mono); font-size: .68rem; color: var(--faint); }
  .picked dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  /* What is actually in the reel. The numbers above say how much; this
     says whether it is the right person. */
  .strip { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .strip figure { margin: 0; position: relative; border-radius: 3px; overflow: hidden; background: var(--sunk); aspect-ratio: 16 / 9; }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip figcaption {
    position: absolute; bottom: 0; right: 0; padding: 1px 3px;
    font-family: var(--mono); font-size: .58rem; color: #fff;
    background: rgba(0,0,0,.62); border-top-left-radius: 3px;
  }
  .strip .waiting { grid-column: 1 / -1; font-size: .72rem; color: var(--faint); }

  .pair { display: grid; grid-template-columns: 1.35fr 1fr; gap: 9px; }

  .footnote { font-size: .72rem; color: var(--faint); line-height: 1.5; margin: 0; }

  .legend { margin-top: 18px; display: grid; gap: 7px; font-size: .78rem; color: var(--muted); max-width: 70ch; }
  .legend b { color: var(--ink); font-weight: 600; }
  .legend p { margin: 0; }

  /* Video or folder: what the source box holds. */
  .seg { display: inline-flex; margin-left: auto; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .seg button { height: 18px; padding: 0 8px; font-size: .62rem; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 0; border-radius: 0; background: transparent; color: var(--faint); font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .field > .labelrow { display: flex; align-items: center; gap: 8px; }
  .field > .labelrow > span { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }

  /* One face per video under a cast card, so a card that has mixed two
     people up shows it without being opened. */
  .faces { display: flex; gap: 3px; padding: 6px 9px 0; }
  .faces img { width: 22px; height: 22px; border-radius: 3px; object-fit: cover; background: var(--sunk); }
  .faces .more { font-family: var(--mono); font-size: .62rem; color: var(--faint); align-self: center; }

  /* "Same person?" -- asked as two faces, one question at a time, because
     it is a thing to look at rather than a score to read. */
  .question {
    margin-bottom: 14px; padding: 12px; background: var(--surface);
    border: 1px solid var(--signal); border-radius: 6px;
    display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: center;
  }
  @media (max-width: 860px) { .question { grid-template-columns: auto auto; } }
  .question figure { margin: 0; width: 104px; }
  .question img { width: 104px; height: 104px; object-fit: cover; border-radius: 4px; display: block; background: var(--sunk); }
  .question figcaption { font-family: var(--mono); font-size: .64rem; color: var(--faint); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .question .ask { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .question .ask b { font-size: .9rem; }
  .question .ask p { margin: 0; font-size: .76rem; color: var(--muted); }
  .question .ask .buttons { display: flex; gap: 6px; flex-wrap: wrap; }

  /* `hidden` must win over any display set above. The question panel is
     a grid, and a grid with `hidden` still showed: an empty orange box
     over the single-video gallery. */
  [hidden] { display: none !important; }

  /* A name offered from earlier videos: a question until someone answers. */
  .suggested { font-style: italic; color: var(--signal); font-weight: 500; }
  .suggest { margin-top: 10px; padding: 9px 10px; border: 1px dashed var(--signal); border-radius: 5px; font-size: .76rem; color: var(--muted); }
  .suggest b { color: var(--ink); }
  .suggest .buttons { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .suggest button { height: 26px; padding: 0 10px; font-size: .74rem; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>


<div class="app">

  <div class="toolbar">
    <div class="field">
      <div class="labelrow">
        <span id="sourceLabel">Source video</span>
        <span class="seg" role="group" aria-label="What to scan">
          <button type="button" data-view="video" aria-pressed="true">Video</button>
          <button type="button" data-view="folder" aria-pressed="false">Folder</button>
        </span>
      </div>
      <div class="control">
        <span class="path" id="videoPath"><span class="dim">No video chosen</span></span>
        <button class="ghost" id="chooseVideo" style="height:24px;padding:0 9px;font-size:.74rem">Choose…</button>
      </div>
    </div>
    <div class="field">
      <label for="mode">Content type</label>
      <select id="mode"></select>
    </div>
    <div class="field">
      <label for="interval">Sampling</label>
      <select id="interval"></select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button class="primary" id="actionBtn">Scan for people</button>
    </div>
  </div>

  <div class="status">
    <span class="msg" id="statusMsg">Starting…</span>
    <div class="bar"><span id="barFill" style="width:0%"></span></div>
    <span class="time" id="statusTime"></span>
  </div>

  <div class="stage">
    <div class="gallery">
      <div class="gallery-head">
        <h2 id="galleryTitle">Who's in this video</h2>
        <span class="meta" id="galleryMeta"></span>
        <span class="fixups" id="fixups" hidden>
          <button class="ghost" id="mergeBtn">Merge</button>
          <button class="ghost" id="splitBtn">Split…</button>
          <button class="ghost" id="renameBtn">Name…</button>
          <button class="ghost" id="discardBtn">Not a person</button>
        </span>
      </div>
      <!-- Above the grid, next to the buttons that open it: below a cast of
           forty it was off-screen, and Split... looked like it did nothing. -->
      <div class="split" id="split" hidden>
        <p class="split-head">
          <b>Which of these is somebody else?</b>
          <span id="splitHint">Pick the shots that are not the same person, then split them off.</span>
          <button class="ghost" id="splitDo">Split off</button>
          <button class="ghost" id="splitCancel">Cancel</button>
        </p>
        <div class="grid tracks" id="tracks"></div>
      </div>
      <div class="question" id="question" hidden></div>
      <div class="grid" id="grid" role="group" aria-label="People found"></div>
      <p class="unassigned" id="unassigned" hidden></p>
    </div>

    <aside class="rail">
      <h3>Export</h3>
      <div class="picked" id="picked" hidden>
        <div class="name" id="pickedName">—</div>
        <dl>
          <dt>on screen</dt><dd id="pickedTime">—</dd>
          <dt>cuts</dt><dd id="pickedCuts">—</dd>
          <dt>reel length</dt><dd id="pickedLen">—</dd>
          <dt>detections</dt><dd id="pickedDet">—</dd>
          <dt id="pickedVideosLabel" hidden>videos</dt><dd id="pickedVideos" hidden>—</dd>
        </dl>
        <div class="suggest" id="suggest" hidden></div>
        <div class="strip" id="strip" hidden></div>
      </div>

      <div class="field">
        <label>Folder</label>
        <div class="control">
          <span class="path" id="folder"></span>
          <button class="ghost" id="chooseFolder" style="height:24px;padding:0 9px;font-size:.74rem">Choose…</button>
        </div>
      </div>

      <div class="field">
        <label for="fname">File name</label>
        <input type="text" id="fname">
      </div>

      <div class="pair">
        <div class="field">
          <label for="enc">Encoder</label>
          <select id="enc"></select>
        </div>
        <div class="field">
          <label for="q">Quality</label>
          <select id="q"></select>
        </div>
      </div>

      <button class="primary" id="exportBtn" disabled>Export reel</button>
      <p class="footnote" id="foot">Choose a person to export.</p>
    </aside>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const clock = (s) => Math.floor(s/60) + ":" + String(Math.round(s%60)).padStart(2,"0");

  let state = { video: "", folder: "", view: "video", people: [], selected: [], busy: null, previewToken: 0, drawn: { video: null, folder: null } };

  const setBar = (fraction) => { $("barFill").style.width = (fraction*100).toFixed(1) + "%"; };
  const status = (html) => { $("statusMsg").innerHTML = html; };

  function fill(select, values, chosen, labelOf) {
    select.innerHTML = values.map(v => {
      const value = labelOf ? v.id : v;
      const label = labelOf ? v.label : labelOf === false ? v : v;
      return `<option value="${value}" ${value === chosen ? "selected" : ""}>${label}</option>`;
    }).join("");
  }

  window.addEventListener("pywebviewready", async () => {
    const s = await pywebview.api.initial_state();
    state.video = s.video;
    $("videoPath").textContent = s.video || "No video chosen";
    if (!s.video) $("videoPath").innerHTML = '<span class="dim">No video chosen</span>';

    $("mode").innerHTML = s.modes.map(m =>
      `<option value="${m.id}" ${m.id===s.mode?"selected":""}>${m.label}</option>`).join("");
    $("interval").innerHTML = s.intervals.map(i =>
      `<option value="${i}" ${i===s.interval?"selected":""}>Every ${i}s</option>`).join("");
    $("enc").innerHTML = s.encoders.map(e =>
      `<option ${e===s.encoder?"selected":""}>${e}</option>`).join("");
    $("q").innerHTML = s.qualities.map(q =>
      `<option ${q===s.quality?"selected":""}>${q}</option>`).join("");
    $("folder").textContent = s.folder;
    $("fname").value = s.filename;
    status("<b>" + s.status + "</b>");
    $("grid").innerHTML = "<p>Press Scan for people.</p>";
  });

  // The source box and the gallery follow the switch. Each view keeps what
  // it last drew, so flicking between them does not lose a scan.
  function showSource() {
    const path = state.view === "folder" ? state.folder : state.video;
    $("sourceLabel").textContent = state.view === "folder" ? "Folder of videos" : "Source video";
    if (path) $("videoPath").textContent = path;
    else $("videoPath").innerHTML = '<span class="dim">' +
      (state.view === "folder" ? "No folder chosen" : "No video chosen") + "</span>";
  }

  function setView(view) {
    if (state.busy || view === state.view) return;
    state.view = view;
    document.querySelectorAll(".seg button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.view === view));
    showSource();
    $("galleryTitle").textContent = view === "folder" ? "Who's in this folder" : "Who's in this video";
    const drawn = state.drawn[view];
    $("question").hidden = true;
    $("unassigned").hidden = true;
    $("galleryMeta").textContent = "";
    if (!drawn) {
      state.people = []; state.selected = [];
      $("fixups").hidden = true; $("picked").hidden = true; $("exportBtn").disabled = true;
      $("grid").innerHTML = "<p>Press Scan for people.</p>";
      $("foot").textContent = "Choose a person to export.";
      return;
    }
    if (view === "folder") drawCast(drawn); else drawPeople(drawn);
  }

  document.querySelectorAll(".seg button").forEach(b =>
    b.addEventListener("click", () => setView(b.dataset.view)));

  $("chooseVideo").addEventListener("click", async () => {
    if (state.view === "folder") {
      const r = await pywebview.api.choose_folder();
      if (r.path) { state.folder = r.path; showSource(); }
      return;
    }
    const r = await pywebview.api.choose_video();
    if (r.path) { state.video = r.path; showSource(); }
  });

  $("chooseFolder").addEventListener("click", async () => {
    const r = await pywebview.api.choose_folder();
    if (r.path) $("folder").textContent = r.path;
  });

  $("mode").addEventListener("change", async (e) => {
    const r = await pywebview.api.set_mode(e.target.value);
    status("<b>" + r.status + "</b>");
  });

  $("actionBtn").addEventListener("click", async () => {
    if (state.busy) { pywebview.api.cancel(); $("actionBtn").disabled = true; return; }
    const r = state.view === "folder"
      ? await pywebview.api.start_folder_scan(state.folder, $("mode").value, Number($("interval").value))
      : await pywebview.api.start_scan(state.video, $("mode").value, Number($("interval").value));
    if (!r.started) { if (r.reason) status("<b>" + r.reason + "</b>"); return; }
    busy("scan");
    status("<b>Scanning…</b>");
  });

  $("exportBtn").addEventListener("click", async () => {
    const start = state.view === "folder" ? pywebview.api.start_folder_export : pywebview.api.start_export;
    const r = await start($("folder").textContent, $("fname").value, $("enc").value, $("q").value);
    if (!r.started) { if (r.reason) status("<b>" + r.reason + "</b>"); return; }
    busy("export");
    status("<b>Exporting…</b>");
  });

  function busy(kind) {
    state.busy = kind;
    $("actionBtn").textContent = "Cancel";
    $("exportBtn").disabled = true;
    ["mode","interval","enc","q","fname","chooseVideo","chooseFolder"].forEach(id => $(id).disabled = true);
    document.querySelectorAll(".seg button").forEach(b => b.disabled = true);
  }

  function idle() {
    state.busy = null;
    $("actionBtn").textContent = "Scan for people";
    $("actionBtn").disabled = false;
    $("exportBtn").disabled = !state.selected.length;
    ["mode","interval","enc","q","fname","chooseVideo","chooseFolder"].forEach(id => $(id).disabled = false);
    document.querySelectorAll(".seg button").forEach(b => b.disabled = false);
  }

  window.onStatus = (d) => status("<b>" + d.text + "</b>");
  window.onScanProgress = (d) => { setBar(d.fraction); $("statusTime").textContent = clock(d.timestamp); };
  window.onDownload = (d) => { setBar(d.fraction); status("<b>Downloading " + d.description + "…</b>"); };
  window.onExportProgress = (d) => { setBar(d.fraction); $("statusTime").textContent = d.done + " / " + d.total; };
  window.onScanCancelled = () => { idle(); setBar(0); status("<b>Scan cancelled.</b>"); };
  window.onExportCancelled = () => { idle(); setBar(0); status("<b>Export cancelled.</b> No partial file was left behind."); };
  window.onRelocated = (d) => { state.video = d.path; showSource(); };
  window.onFailed = (d) => { idle(); setBar(0); status("<b>" + d.title + ".</b> " + d.detail); };
  window.onExported = (d) => {
    idle(); setBar(1);
    const left = (d.leftOut || []).map(l => esc(l.video) + " (" + esc(l.reason) + ")");
    status("<b>Reel saved.</b> " + esc(d.path) +
      (left.length ? " Left out: " + left.join(", ") + "." : ""));
  };

  window.onScanned = (d) => {
    idle();
    setBar(1);
    $("statusTime").textContent = d.elapsed.toFixed(0) + "s";
    // A scan that comes back instantly reads as one that did not look, so
    // say it was reused and what that saved.
    status(
      (d.reused
        ? "<b>Reused an earlier scan.</b> " + Math.round(d.originalSeconds) + "s of work skipped \u2014 "
        : "<b>Scan complete.</b> ") +
      d.people.length + " people in " + d.frames + " sampled frames."
    );
    $("galleryMeta").textContent = "sorted by screen time";

    state.drawn.video = d;
    drawPeople(d);

    const u = $("unassigned");
    u.hidden = false;
    u.innerHTML = "<b>" + d.unassigned + " detections unassigned</b> — below the screen-time cutoff, or rejected as non-faces. Nothing is discarded.";
  };

  function drawPeople(d) {
    state.people = d.people;
    state.selected = [];
    $("mergeBtn").hidden = $("splitBtn").hidden = $("discardBtn").hidden = false;
    $("question").hidden = true;
    $("pickedVideosLabel").hidden = $("pickedVideos").hidden = true;
    $("exportBtn").disabled = true;
    $("picked").hidden = true;
    $("strip").hidden = true;
    $("split").hidden = true;
    $("fixups").hidden = !d.people.length;
    updateFixups();

    if (!d.people.length) {
      $("grid").innerHTML = "<p>No one found. Try a finer sampling interval.</p>";
      return;
    }
    $("grid").innerHTML = d.people.map((p, i) => `
      <button class="card" aria-pressed="false" data-i="${p.index}">
        <img class="thumb" src="${p.thumbnail}" alt="Person ${i+1}">
        <span class="info">
          <span class="who">${who(p, "Person " + (i+1))} <span class="rank">#${i+1}</span></span>
          <span class="stat">${p.detections} det</span>
        </span>
      </button>`).join("");
  }

  // Which corrections the current selection allows. Merge needs two
  // people, split needs exactly one, discarding needs at least one.
  function updateFixups() {
    const n = state.selected.length;
    $("mergeBtn").disabled = n < 2;
    $("splitBtn").disabled = n !== 1;
    $("renameBtn").disabled = n !== 1;
    $("discardBtn").disabled = n < 1 || n >= state.people.length;
  }

  async function applyEdit(operation, tracks) {
    if (state.view === "folder") {
      // Across the folder: merge and split are kept as answers, discard
      // is removed from every video's kept scan.
      const r = await pywebview.api.edit_cast(operation, tracks || []);
      if (!r.applied) { status("<b>" + esc(r.reason) + "</b>"); return; }
      state.drawn.folder = r;
      drawCast(r);
      status("<b>" + esc(r.note) + "</b> " + r.people.length + " people now.");
      return;
    }
    const r = await pywebview.api.edit_people(operation, tracks || []);
    if (!r.applied) { status("<b>" + r.reason + "</b>"); return; }
    state.drawn.video = r;
    drawPeople(r);
    status("<b>" + r.note + "</b> " + r.people.length + " people now.");
  }

  // A name belongs to the person, not to the card's position: the gallery
  // renumbers itself after every correction, and "Person #2" moves.
  // A card's name, or the name the people library offers for it -- shown
  // as a question, since nothing is named until someone says so.
  const who = (p, fallback) => p.name ? esc(p.name)
    : p.suggestion ? '<span class="suggested" title="Looks like someone named in an earlier video">' + esc(p.suggestion) + "?</span>"
    : esc(fallback);

  // Names the one chosen card or person, in whichever view is showing.
  async function applyName(typed) {
    if (state.view === "folder") {
      const r = await pywebview.api.name_cast_person(typed);
      if (!r.applied) { status("<b>" + r.reason + "</b>"); return; }
      state.drawn.folder = r;
      drawCast(r);
      status("<b>" + esc(r.note) + "</b>");
      return;
    }
    const r = await pywebview.api.edit_people("rename", [], typed);
    if (!r.applied) { status("<b>" + r.reason + "</b>"); return; }
    state.drawn.video = r;
    keepSelection(r);
    status("<b>" + r.note + "</b>");
  }

  // Redraws the gallery with the same cards still chosen: naming and
  // declining a suggestion change no membership.
  function keepSelection(r) {
    const keep = state.selected.slice();
    drawPeople(r);
    state.selected = keep;
    updateFixups();
    document.querySelectorAll("#grid .card").forEach(c =>
      c.setAttribute("aria-pressed", keep.includes(Number(c.dataset.i)))
    );
    showSuggestion();
  }

  $("renameBtn").addEventListener("click", async () => {
    const person = state.people.find(p => p.index === state.selected[0]);
    const typed = window.prompt(
      state.view === "folder"
        ? "What is this person called? The name is saved in every video they are in."
        : "What is this person called? Leave it empty to clear the name.",
      person && person.name ? person.name : (person && person.suggestion) || ""
    );
    if (typed === null) return;
    await applyName(typed);
  });

  // "Looks like Jamie Lee": asked once one unnamed card with a suggestion
  // is chosen. Yes names them the ordinary way, so the library learns from
  // it; no keeps that name off that card for the rest of the session.
  function showSuggestion() {
    const box = $("suggest");
    const person = state.selected.length === 1
      ? state.people.find(p => p.index === state.selected[0]) : null;
    if (!person || person.name || !person.suggestion) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    box.innerHTML = `Looks like <b>${esc(person.suggestion)}</b>, named in an earlier video.
      <div class="buttons">
        <button class="primary" data-suggest="yes">That's them</button>
        <button class="ghost" data-suggest="no">Not them</button>
      </div>`;
  }

  $("suggest").addEventListener("click", async (e) => {
    const button = e.target.closest("button[data-suggest]");
    if (!button) return;
    const person = state.people.find(p => p.index === state.selected[0]);
    if (!person || !person.suggestion) return;
    if (button.dataset.suggest === "yes") { await applyName(person.suggestion); return; }
    const r = state.view === "folder"
      ? await pywebview.api.decline_cast_suggestion(person.index, person.suggestion)
      : await pywebview.api.decline_suggestion(person.index, person.suggestion);
    if (!r.applied) return;
    if (state.view === "folder") { state.drawn.folder = r; drawCast(r); }
    else { state.drawn.video = r; keepSelection(r); }
    status("<b>Not " + esc(person.suggestion) + ".</b> It will not be offered for them again this session.");
  });

  const esc = (text) => text.replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  $("mergeBtn").addEventListener("click", () => applyEdit("merge"));
  $("discardBtn").addEventListener("click", () => applyEdit("discard"));

  $("splitBtn").addEventListener("click", async () => {
    if (state.view === "folder") {
      const r = await pywebview.api.cards_of_cast(state.selected[0]);
      if (!r.cards.length) {
        status("<b>Nothing to split.</b> This person is one card in one video.");
        return;
      }
      $("splitHint").textContent = "Pick the faces that are someone else. They stay apart from now on.";
      $("tracks").innerHTML = r.cards.map(c => `
        <button class="card" aria-pressed="false" data-t="${c.card}">
          <img src="${c.image}" alt="In ${esc(c.video)}">
          <span class="at">${esc(c.video)} · ${c.onScreen}</span>
        </button>`).join("");
      $("split").hidden = false;
      return;
    }
    $("splitHint").textContent = "Pick the shots that are not the same person, then split them off.";
    const r = await pywebview.api.tracks_of(state.selected[0]);
    if (!r.tracks.length) {
      status("<b>Nothing to split.</b> This person was seen in one unbroken run.");
      return;
    }
    $("tracks").innerHTML = r.tracks.map(t => `
      <button class="card" aria-pressed="false" data-t="${t.track}">
        <img src="${t.image}" alt="A shot at ${t.at}">
        <span class="at">${t.at}</span>
      </button>`).join("");
    $("split").hidden = false;
  });

  $("splitCancel").addEventListener("click", () => { $("split").hidden = true; });

  $("tracks").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    card.setAttribute("aria-pressed", card.getAttribute("aria-pressed") !== "true");
  });

  $("splitDo").addEventListener("click", () => {
    const picked = [...document.querySelectorAll("#tracks .card[aria-pressed='true']")]
      .map(c => state.view === "folder" ? c.dataset.t : Number(c.dataset.t));
    if (!picked.length) { status("<b>Pick the shots that are somebody else.</b>"); return; }
    $("split").hidden = true;
    applyEdit("split", picked);
  });

  // ------------------------------------------------------------ folder view

  window.onFolderScanned = (d) => {
    idle();
    setBar(1);
    $("statusTime").textContent = "";
    status("<b>Folder scanned.</b> " + d.people.length + " people across " +
      d.videoCount + " video" + (d.videoCount === 1 ? "" : "s") +
      (d.questions.length ? ", " + d.questions.length + " to check." : "."));
    state.drawn.folder = d;
    drawCast(d);
  };

  function drawCast(d) {
    state.people = d.people;
    state.selected = d.selected || [];
    $("split").hidden = true;
    $("mergeBtn").hidden = $("splitBtn").hidden = $("discardBtn").hidden = false;
    $("fixups").hidden = !d.people.length;
    updateFixups();
    $("galleryMeta").textContent = d.videoCount + " videos · sorted by screen time";
    if (!state.selected.length) {
      $("picked").hidden = true; $("exportBtn").disabled = true;
      $("foot").textContent = "Choose a person to export.";
    }

    drawQuestion(d.questions);
    showSuggestion();

    if (!d.people.length) {
      $("grid").innerHTML = "<p>No one found in these videos. Try a finer sampling interval.</p>";
    } else {
      $("grid").innerHTML = d.people.map((p, i) => `
        <button class="card" aria-pressed="${state.selected.includes(p.index)}" data-i="${p.index}">
          <img class="thumb" src="${p.thumbnail}" alt="${esc(p.label)}">
          <span class="faces">${p.faces.slice(0, 4).map(f =>
            `<img src="${f.thumbnail}" alt="In ${esc(f.video)}" title="${esc(f.video)}">`).join("")}
            ${p.faces.length > 4 ? `<span class="more">+${p.faces.length - 4}</span>` : ""}</span>
          <span class="info">
            <span class="who">${who(p, p.label)} <span class="rank">#${i+1}</span></span>
            <span class="stat">in ${p.videos} of ${d.videoCount} · ${p.onScreen}</span>
          </span>
        </button>`).join("");
    }

    const u = $("unassigned");
    u.hidden = !d.skipped.length;
    u.innerHTML = d.skipped.length
      ? "<b>Could not read " + d.skipped.length + " video" + (d.skipped.length === 1 ? "" : "s") + ":</b> " +
        d.skipped.map(s => esc(s.video) + " (" + esc(s.reason) + ")").join(", ")
      : "";
  }

  function drawQuestion(questions) {
    const box = $("question");
    if (!questions.length) { box.hidden = true; box.innerHTML = ""; return; }
    const q = questions[0];
    box.hidden = false;
    box.innerHTML = `
      <figure><img src="${q.first.thumbnail}" alt=""><figcaption>${esc(q.first.video)}</figcaption></figure>
      <figure><img src="${q.second.thumbnail}" alt=""><figcaption>${esc(q.second.video)}</figcaption></figure>
      <div class="ask">
        <b>Same person?</b>
        <p>These look alike but not clearly enough to join on their own.${
          questions.length > 1 ? " " + (questions.length - 1) + " more after this." : ""}</p>
        <div class="buttons">
          <button class="primary" data-answer="yes" data-q="${q.id}">Same person</button>
          <button class="ghost" data-answer="no" data-q="${q.id}">Different people</button>
        </div>
      </div>`;
  }

  $("question").addEventListener("click", async (e) => {
    const button = e.target.closest("button[data-answer]");
    if (!button) return;
    const r = await pywebview.api.answer_question(Number(button.dataset.q), button.dataset.answer === "yes");
    if (!r.applied) { status("<b>" + esc(r.reason) + "</b>"); return; }
    state.drawn.folder = r;
    drawCast(r);
    status("<b>" + esc(r.note) + "</b> " + r.people.length + " people now.");
  });

  function showPicked(r) {
    $("picked").hidden = false;
    $("pickedName").textContent = r.name;
    $("pickedTime").textContent = r.onScreen;
    $("pickedCuts").textContent = r.cuts;
    $("pickedLen").textContent = r.reel;
    $("pickedDet").textContent = r.detections;
    const folder = r.videos !== undefined;
    $("pickedVideosLabel").hidden = $("pickedVideos").hidden = !folder;
    if (folder) $("pickedVideos").textContent = r.videos;
    if (r.filename) $("fname").value = r.filename;
    $("exportBtn").disabled = false;
    state.previewToken = r.token;
    const strip = $("strip");
    strip.hidden = false;
    strip.innerHTML = '<p class="waiting">Reading the reel…</p>';
  }

  $("grid").addEventListener("click", async (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    if (state.view === "folder") {
      const r = await pywebview.api.select_cast_person(Number(card.dataset.i), $("fname").value);
      if (!r.accepted) return;
      state.selected = r.indexes;
      $("split").hidden = true;
      updateFixups();
      document.querySelectorAll("#grid .card").forEach(c =>
        c.setAttribute("aria-pressed", state.selected.includes(Number(c.dataset.i))));
      if (!r.indexes.length) {
        $("picked").hidden = true; $("strip").hidden = true; $("exportBtn").disabled = true;
        $("foot").textContent = "Choose a person to export.";
        return;
      }
      showPicked(r);
      showSuggestion();
      $("foot").textContent = "Cuts " + r.cuts + " segments from " + r.videos +
        " video" + (r.videos === 1 ? "" : "s") + " and joins them into one file." +
        (r.indexes.length > 1 ? " Any scene with any of them." : "") +
        (r.repeated ? " Leaves out " + r.repeated +
          " that later videos repeat of footage already in the reel." : "");
      return;
    }
    const r = await pywebview.api.select_person(Number(card.dataset.i), $("fname").value);
    if (!r.accepted) return;

    // Clicking is a toggle: a second card joins the first rather than
    // replacing it, so "every scene either lead is in" is one reel.
    state.selected = r.indexes;
    updateFixups();
    document.querySelectorAll("#grid .card").forEach(c =>
      c.setAttribute("aria-pressed", r.indexes.includes(Number(c.dataset.i)))
    );

    if (!r.indexes.length) {
      $("picked").hidden = true;
      $("strip").hidden = true;
      $("foot").textContent = "Choose a person to export.";
      $("exportBtn").disabled = true;
      return;
    }

    $("picked").hidden = false;
    $("pickedName").textContent = r.name;
    $("pickedTime").textContent = r.onScreen;
    $("pickedCuts").textContent = r.cuts;
    $("pickedLen").textContent = r.reel;
    $("pickedDet").textContent = r.detections;
    if (r.filename) $("fname").value = r.filename;
    $("foot").textContent =
      "Cuts " + r.cuts + " segments and joins them into one file." +
      (r.indexes.length > 1 ? " Any scene with any of them." : "");
    $("exportBtn").disabled = false;
    showSuggestion();

    state.previewToken = r.token;
    const strip = $("strip");
    strip.hidden = false;
    strip.innerHTML = '<p class="waiting">Reading the reel…</p>';
  });

  // Frames from the reel itself, so the numbers above are not the only
  // thing standing between a click and a multi-minute encode.
  window.onPreview = (d) => {
    if (d.token !== state.previewToken) return;
    const strip = $("strip");
    if (!d.frames.length) {
      strip.hidden = true;
      return;
    }
    strip.hidden = false;
    strip.innerHTML = d.frames.map(f => `
      <figure title="${f.video ? esc(f.video) + " " : ""}${f.at}">
        <img src="${f.image}" alt="A frame from the reel at ${f.at}">
        <figcaption>${f.at}</figcaption>
      </figure>`).join("");
  };
</script>
