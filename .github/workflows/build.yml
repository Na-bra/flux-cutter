name: Tests and desktop builds

# PyInstaller freezes the interpreter it is running on, so a Windows .exe
# has to be built on Windows and a macOS .app on macOS. There is no
# cross-compilation to fall back on; this matrix is the whole reason the
# workflow exists.
#
# The tests run on every pull request and every push to main; the builds
# run only for a tag. That split is deliberate. Until it existed the tests
# ran only when a release was tagged, which meant three pull requests
# merged with no check at all and a fix went out that wrote silence into
# 98 of 100 joins -- caught by tests that already existed and that nothing
# was running. Testing a branch costs a couple of minutes on one runner;
# building it costs two platforms, so branches do not build.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also create a draft release"
        type: boolean
        default: false

# A second push to the same branch makes the first run's answer worthless,
# so it is cancelled rather than left to finish. Tags are excluded: their
# runs produce a release, and cancelling one halfway would leave a draft
# with one platform's build attached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# Read-only by default, now that a pull request can start this workflow.
# Only the job that publishes a release needs more, and it asks for it.
permissions:
  contents: read

jobs:
  test:
    # Runs for every pull request, every push to main, and every tag.
    # assets/ is not in the repository, so the tests that need real footage
    # or the models skip themselves (tests/conftest.py) and the rest run --
    # including the ones marked runs_without_assets, which live in a gated
    # module but touch no footage, and the sync tests, which generate the
    # footage they need and so cover cutting here too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run the tests that do not need sample footage
        run: pytest -q

  build:
    needs: test
    # Tags and a manual run only. A pull request wants to know whether the
    # code is sound, which the tests answer; it does not need two
    # installers nobody will download.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      # One platform failing should not deny you the other's artifact.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FluxCutter-macos
            bundle: dist/FluxCutter.app
          - os: windows-latest
            artifact: FluxCutter-windows
            bundle: dist/FluxCutter

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller

      - name: Check the window's dependencies are here
        # The window draws through the system web view, so there is no
        # toolkit to check for -- but a build without pywebview produces an
        # app that dies on its first import, which is better caught here
        # than read out of a PyInstaller traceback.
        run: python -c "import webview; print('pywebview ok')"

      - name: Build
        run: pyinstaller packaging/FluxCutter.spec --noconfirm

      - name: Check the build produced something that runs
        # Not a smoke test of the UI -- there is no display on a runner --
        # but it catches a bundle that cannot import its own dependencies,
        # which is the common way a PyInstaller build fails silently.
        shell: bash
        run: |
          test -e "${{ matrix.bundle }}" || { echo "no bundle at ${{ matrix.bundle }}"; exit 1; }
          du -sh "${{ matrix.bundle }}"

      - name: Package
        # Zipped rather than raw: a .app is a directory, and uploading it
        # unzipped loses the executable bit and the bundle structure.
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent FluxCutter.app ../${{ matrix.artifact }}.zip
          else
            7z a ../${{ matrix.artifact }}.zip FluxCutter
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The one job that writes anything back to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The message lives on the tag's own object, not on the commit it
          # points at, so a shallow checkout would not have it to read.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the notes from the tag's message
        # Every draft used to arrive carrying the install text and nothing
        # about what changed, which left the notes to be written by hand
        # afterwards -- a step that is easy to forget and was nearly
        # forgotten for 1.9.0. An annotated tag already says what changed;
        # this puts that at the top. A tag with no message still produces
        # exactly the notes every release before this one shipped.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python packaging/release_notes.py --tag "$TAG" > release-notes.md
          echo "--- notes this release will carry ---"
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: true
          body_path: release-notes.md
