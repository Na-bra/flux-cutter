name: Webview probe

# Throwaway. Answers one question before the desktop window is rewritten:
# does pywebview survive PyInstaller on Windows, and does a frozen build
# actually open a WebView2 window on a machine nobody prepared for it?
#
# Delete this file once that is answered either way.

on:
  workflow_dispatch:
  push:
    branches: ["webview-ui"]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller

      - name: Is a WebView2 runtime present at all (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $found = $false
          foreach ($k in $keys) {
            if (Test-Path $k) {
              $v = (Get-ItemProperty $k).pv
              Write-Host "WebView2 runtime present, version $v"
              $found = $true
            }
          }
          if (-not $found) { Write-Host "NO WebView2 runtime found in the registry" }

      - name: Write the probe
        shell: bash
        run: |
          cat > probe.py <<'PY'
          """Open a window, prove JS runs and can call Python, then exit."""
          import os, sys, threading, time, webview

          result = {}

          class Api:
              def ping(self, value):
                  result["from_js"] = value
                  return value

          def drive(window):
              try:
                  time.sleep(2.0)
                  result["title"] = window.evaluate_js("document.title")
                  result["dom"] = window.evaluate_js("document.querySelectorAll('.card').length")
                  window.evaluate_js("pywebview.api.ping(7)")
                  time.sleep(1.0)
              except Exception as exc:
                  result["error"] = repr(exc)
              ok = result.get("title") == "probe" and result.get("from_js") == 7
              print("PROBE", "PASS" if ok else "FAIL", result, flush=True)
              os._exit(0 if ok else 1)

          threading.Timer(90, lambda: (print("PROBE TIMEOUT", result, flush=True), os._exit(1))).start()
          window = webview.create_window(
              "probe",
              html="<title>probe</title><div class='card'></div><div class='card'></div>",
              js_api=Api(),
          )
          webview.start(drive, window)
          PY

      - name: Does it run unfrozen
        run: python probe.py

      - name: Freeze it
        run: pyinstaller --noconfirm --windowed --name probe probe.py

      - name: Does the frozen build open a window
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/probe/probe.exe > frozen.log 2>&1 || true
          else
            ./dist/probe.app/Contents/MacOS/probe > frozen.log 2>&1 || true
          fi
          echo "--- frozen output ---"
          cat frozen.log
          grep -q "PROBE PASS" frozen.log
